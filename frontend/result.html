<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admission Result — AdmitIQ</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .result-wrapper {
      max-width: 820px;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    /* ── Verdict card ── */
    .verdict-card {
      border-radius: var(--radius-lg);
      padding: 2.5rem;
      text-align: center;
      margin-bottom: 1.75rem;
      position: relative;
      overflow: hidden;
      color: #fff;
    }
    .verdict-card.admitted  { background: linear-gradient(135deg, #064e3b 0%, #065f46 40%, #047857 100%); }
    .verdict-card.rejected  { background: linear-gradient(135deg, #7f1d1d 0%, #991b1b 40%, #b91c1c 100%); }
    .verdict-card::before {
      content: '';
      position: absolute; inset: 0;
      background: radial-gradient(ellipse at 50% -20%, rgba(255,255,255,.12) 0%, transparent 60%);
    }

    .verdict-icon  { font-size: 4rem; margin-bottom: 1rem; display: block; }
    .verdict-title { font-size: 2.2rem; font-weight: 800; margin-bottom: .5rem; color: #fff; }
    .verdict-sub   { opacity: .9; font-size: 1rem; }

    .verdict-meta {
      display: flex; justify-content: center;
      gap: 2rem; margin-top: 1.75rem; flex-wrap: wrap;
    }
    .verdict-meta-item { text-align: center; }
    .verdict-meta-item .val { font-size: 1.6rem; font-weight: 800; color: #fff; }
    .verdict-meta-item .lbl { font-size: .78rem; opacity: .8; margin-top: .2rem; }

    /* ── Summary grid ── */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 1.75rem;
    }
    .summary-item {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 1rem;
    }
    .s-label {
      font-size: .75rem; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: .04em;
    }
    .s-value {
      font-weight: 700; font-size: 1.05rem;
      margin-top: .25rem; color: var(--text);
    }

    /* ── College recommendations ── */
    .college-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 1.25rem 1.5rem;
      display: flex; align-items: center;
      justify-content: space-between;
      flex-wrap: wrap; gap: 1rem;
      transition: transform .2s, box-shadow .2s;
    }
    .college-card:hover { transform: translateY(-2px); box-shadow: var(--shadow); }

    .rank-num {
      width: 36px; height: 36px;
      background: var(--primary-light);
      border-radius: 50%;
      display: flex; align-items: center; justify-content: center;
      font-weight: 800; color: var(--primary);
    }
    .c-name  { font-weight: 700; font-size: 1rem; color: var(--text); }
    .c-info  { font-size: .82rem; color: var(--text-muted); margin-top: .2rem; }

    @media (max-width: 600px) {
      .verdict-card { padding: 1.75rem 1.25rem; }
      .verdict-title { font-size: 1.6rem; }
    }
  </style>
</head>

<body>

<nav class="navbar" id="main-navbar"></nav>

<div class="result-wrapper" id="result-content">
  <div class="text-center" style="padding:4rem">
    <div class="spinner" style="margin:0 auto;width:32px;height:32px;
         border:4px solid var(--border);border-top-color:var(--primary);
         border-radius:50%;animation:spin .7s linear infinite"></div>
    <p class="text-muted" style="margin-top:1rem">Loading your results…</p>
  </div>
</div>

<footer>
  <strong>AdmitIQ</strong> — AI-Based College Admission Screening System
</footer>

<script src="app.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
  const raw = sessionStorage.getItem("prediction_result");

  if (!raw) {
    document.getElementById("result-content").innerHTML = `
      <div class="card text-center" style="margin-top:3rem;max-width:480px;margin-inline:auto">
        <h2>No Result Found</h2>
        <p class="text-muted" style="margin-top:.75rem">Please fill the admission form first.</p>
        <a href="form.html" class="btn btn-primary" style="display:inline-block;margin-top:1.5rem">
          Go to Form
        </a>
      </div>`;
    return;
  }

  try {
    renderResult(JSON.parse(raw));
  } catch {
    document.getElementById("result-content").innerHTML =
      `<div class="alert alert-danger" style="margin-top:2rem">
         ❌ Could not read result data. Please try the form again.
       </div>`;
  }
});

function renderResult(d) {
  // FIX: check prediction string from API ("Eligible" / "Not Eligible")
  const admitted = d.prediction === "Eligible" || d.admitted === true;
  const score    = d.composite_score ?? 0;
  const conf     = d.confidence       ?? 0;
  const recs     = Array.isArray(d.recommendations) ? d.recommendations : [];

  document.getElementById("result-content").innerHTML = `

    <!-- Verdict -->
    <div class="verdict-card ${admitted ? 'admitted' : 'rejected'}">
      <span class="verdict-icon">${admitted ? '🎉' : '😔'}</span>
      <div class="verdict-title">${admitted ? 'Congratulations!' : 'Not Eligible'}</div>
      <div class="verdict-sub">
        ${admitted
          ? 'You meet the admission criteria based on your academic profile.'
          : 'Your current profile does not meet the minimum criteria. Keep improving!'}
      </div>
      <div class="verdict-meta">
        <div class="verdict-meta-item">
          <div class="val">${score}</div>
          <div class="lbl">Composite Score</div>
        </div>
        <div class="verdict-meta-item">
          <div class="val">${conf}%</div>
          <div class="lbl">AI Confidence</div>
        </div>
        <div class="verdict-meta-item">
          <div class="val">${recs.length}</div>
          <div class="lbl">Colleges Matched</div>
        </div>
      </div>
    </div>

    <!-- Academic Profile Summary -->
    <h3 style="margin-bottom:1rem">Your Academic Profile</h3>
    <div class="summary-grid">
      <div class="summary-item"><div class="s-label">Name</div>
        <div class="s-value">${d.name || '—'}</div></div>
      <div class="summary-item"><div class="s-label">Age / Gender</div>
        <div class="s-value">${d.age || '—'} / ${d.gender || '—'}</div></div>
      <div class="summary-item"><div class="s-label">10th %</div>
        <div class="s-value">${d.marks_10 ?? 0}%</div></div>
      <div class="summary-item"><div class="s-label">12th %</div>
        <div class="s-value">${d.marks_12 ?? 0}%</div></div>
      <div class="summary-item"><div class="s-label">Entrance Score</div>
        <div class="s-value">${d.entrance_score ?? 0}/100</div></div>
      <div class="summary-item"><div class="s-label">Preferred Course</div>
        <div class="s-value">${d.preferred_course || '—'}</div></div>
    </div>

    <!-- Score Breakdown -->
    <div class="card mb-3">
      <h3 style="margin-bottom:1.25rem">Score Breakdown</h3>
      <div style="display:flex;flex-direction:column;gap:.9rem">
        ${scoreBar('10th Marks (25% weight)',       d.marks_10       ?? 0, 'var(--primary)')}
        ${scoreBar('12th Marks (40% weight)',       d.marks_12       ?? 0, '#a78bfa')}
        ${scoreBar('Entrance Score (35% weight)',   d.entrance_score ?? 0, 'var(--accent)')}
        ${scoreBar('Composite Score',               score,                 'var(--success)')}
      </div>
    </div>

    <!-- College Recommendations (only if eligible) -->
    ${admitted && recs.length ? `
      <h3 style="margin-bottom:.5rem">Recommended Colleges</h3>
      <p class="text-muted mb-2">
        Based on your composite score of <strong>${score}</strong>, you qualify for:
      </p>
      <div style="display:flex;flex-direction:column;gap:.75rem;margin-bottom:2rem">
        ${recs.map((c, i) => `
          <div class="college-card">
            <div style="display:flex;align-items:center;gap:1rem">
              <div class="rank-num">${i + 1}</div>
              <div>
                <div class="c-name">${c.college}</div>
                <div class="c-info">Cutoff: ${c.cutoff}%</div>
              </div>
            </div>
            <span class="badge ${score - c.cutoff >= 10 ? 'badge-success' : 'badge-primary'}">
              ${score - c.cutoff >= 10 ? '✅ High Match' : '🔵 Match'}
            </span>
          </div>`).join('')}
      </div>` : ''}

    <!-- Tip for non-eligible -->
    ${!admitted ? `
      <div class="alert alert-info mb-3">
        <strong>💡 Tip:</strong>
        Focus on improving your 12th percentage and entrance exam score.
        A composite score of 60+ is needed for most colleges.
      </div>` : ''}

    <!-- Action buttons -->
    <div style="display:flex;gap:1rem;flex-wrap:wrap">
      <a href="form.html"     class="btn btn-primary">Try Again</a>
      <a href="colleges.html" class="btn btn-outline">View All Colleges</a>
      <button class="btn btn-ghost" onclick="window.print()">🖨 Print / Save PDF</button>
    </div>
  `;
}

function scoreBar(label, value, color) {
  const pct = Math.min(parseFloat(value) || 0, 100);
  return `
    <div>
      <div style="display:flex;justify-content:space-between;margin-bottom:.3rem">
        <span style="font-size:.85rem;color:var(--text-muted)">${label}</span>
        <span style="font-weight:700;font-size:.9rem;color:var(--text)">${value}%</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" style="width:${pct}%;background:${color}"></div>
      </div>
    </div>`;
}
</script>
</body>
</html>
