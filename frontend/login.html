<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login / Register — AdmitIQ</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body { display: flex; flex-direction: column; min-height: 100vh; }

    .auth-wrapper {
      flex: 1;
      display: flex; align-items: center; justify-content: center;
      padding: 2rem 1rem;
    }

    .auth-container { width: 100%; max-width: 440px; }

    .auth-header { text-align: center; margin-bottom: 2rem; }
    .auth-header .logo {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--primary), #a78bfa);
      border-radius: 18px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.8rem; margin: 0 auto 1rem;
      box-shadow: var(--shadow);
    }
    .auth-header h1 { font-size: 1.8rem; }
    .auth-header p  { color: var(--text-muted); font-size: .9rem; margin-top: .4rem; }

    .auth-tabs {
      display: flex;
      background: var(--bg-input);
      border-radius: var(--radius-sm);
      padding: 4px;
      margin-bottom: 1.75rem;
    }
    .tab-btn {
      flex: 1; padding: .6rem;
      border: none; background: transparent; cursor: pointer;
      font-family: 'DM Sans', sans-serif; font-weight: 600;
      font-size: .9rem; color: var(--text-muted);
      border-radius: calc(var(--radius-sm) - 2px);
      transition: all var(--transition);
    }
    .tab-btn.active {
      background: var(--bg-card);
      color: var(--primary);
      box-shadow: var(--shadow-sm);
    }

    .auth-form { display: none; }
    .auth-form.active { display: flex; flex-direction: column; gap: 1.1rem; }

    .demo-creds {
      background: var(--primary-light);
      border: 1px solid var(--border-focus);
      border-radius: var(--radius-sm);
      padding: .85rem 1rem;
      font-size: .83rem;
    }
    .demo-creds strong { color: var(--primary); }
    .demo-creds code {
      background: var(--bg-card); padding: .1rem .4rem;
      border-radius: 4px; font-size: .8rem;
    }
  </style>
</head>
<body>

<nav class="navbar" id="main-navbar"></nav>

<div class="auth-wrapper">
  <div class="auth-container">
    <div class="auth-header">
      <div class="logo">🎓</div>
      <h1>Welcome to AdmitIQ</h1>
      <p>Sign in to check your college admission eligibility</p>
    </div>

    <!-- Tabs -->
    <div class="auth-tabs">
      <button class="tab-btn active" onclick="switchTab('login')">Login</button>
      <button class="tab-btn"        onclick="switchTab('register')">Register</button>
    </div>

    <!-- ── Login Form ── -->
    <form class="auth-form active" id="login-form" onsubmit="handleLogin(event)" novalidate>

      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" id="login-username" class="form-control"
               placeholder="Enter your username" autocomplete="username">
        <span class="form-error" id="err-login-username"></span>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrapper">
          <input type="password" id="login-password" class="form-control"
                 placeholder="Enter your password" autocomplete="current-password"
                 style="padding-right:2.8rem">
          <button type="button" class="pw-toggle"
                  onclick="togglePassword('login-password', this)"
                  title="Show/hide password">👁️</button>
        </div>
        <span class="form-error" id="err-login-password"></span>
      </div>

      <div id="login-alert"></div>

      <button type="submit" class="btn btn-primary w-full btn-lg" id="login-btn">
        Login
      </button>
    </form>

    <!-- ── Register Form ── -->
    <form class="auth-form" id="register-form" onsubmit="handleRegister(event)" novalidate>

      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" id="reg-username" class="form-control"
               placeholder="Choose a username" autocomplete="username">
        <span class="form-error" id="err-reg-username"></span>
      </div>

      <div class="form-group">
        <label class="form-label">Password</label>
        <div class="input-wrapper">
          <input type="password" id="reg-password" class="form-control"
                 placeholder="Create a strong password" autocomplete="new-password"
                 style="padding-right:2.8rem">
          <button type="button" class="pw-toggle"
                  onclick="togglePassword('reg-password', this)"
                  title="Show/hide password">👁️</button>
        </div>
        <div class="form-hint">Minimum 6 characters</div>
        <span class="form-error" id="err-reg-password"></span>
      </div>

      <div class="form-group">
        <label class="form-label">Confirm Password</label>
        <div class="input-wrapper">
          <input type="password" id="reg-confirm" class="form-control"
                 placeholder="Repeat your password" autocomplete="new-password"
                 style="padding-right:2.8rem">
          <button type="button" class="pw-toggle"
                  onclick="togglePassword('reg-confirm', this)"
                  title="Show/hide password">👁️</button>
        </div>
        <span class="form-error" id="err-reg-confirm"></span>
      </div>

      <div id="register-alert"></div>

      <button type="submit" class="btn btn-primary w-full btn-lg" id="register-btn">
        Create Account
      </button>
    </form>

  </div>
</div>

<footer>
  <strong>AdmitIQ</strong> — AI-Based College Admission Screening System
</footer>

<script src="app.js"></script>
<script>
  // ── Tab switch ──────────────────────────────────────────────────────────────
  function switchTab(tab) {
    document.querySelectorAll(".tab-btn").forEach((b, i) =>
      b.classList.toggle("active", (i === 0 && tab === "login") || (i === 1 && tab === "register"))
    );
    document.getElementById("login-form").classList.toggle("active",    tab === "login");
    document.getElementById("register-form").classList.toggle("active", tab === "register");
    clearAllErrors();
  }

  // Auto-switch if URL has #register
  if (window.location.hash === "#register") switchTab("register");

  // Redirect if already logged in
  document.addEventListener("DOMContentLoaded", () => {
    if (isLoggedIn()) window.location.href = "form.html";
  });

  // ── Login ───────────────────────────────────────────────────────────────────
  async function handleLogin(e) {
    e.preventDefault();
    clearAllErrors();

    const username = document.getElementById("login-username").value.trim();
    const password = document.getElementById("login-password").value;

    let valid = true;
    if (!username) { showError("err-login-username", "Username is required"); valid = false; }
    if (!password) { showError("err-login-password", "Password is required");  valid = false; }
    if (!valid) return;

    const btn = document.getElementById("login-btn");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Logging in…';

    try {
      const data = await apiPost("/login", { username, password });

      if (data.success) {
        // FIX: store username (from the input we typed) + role returned by server
        setSession({ username, role: data.role });
        showToast("Login successful! Welcome back.", "success");
        setTimeout(() => {
          window.location.href = data.role === "admin" ? "admin.html" : "form.html";
        }, 600);
      } else {
        document.getElementById("login-alert").innerHTML =
          `<div class="alert alert-danger mt-2">❌ ${data.message || "Invalid credentials"}</div>`;
      }
    } catch {
      document.getElementById("login-alert").innerHTML =
        `<div class="alert alert-danger mt-2">❌ Server error — is the backend running?</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = "Login";
    }
  }

  // ── Register ────────────────────────────────────────────────────────────────
  async function handleRegister(e) {
    e.preventDefault();
    clearAllErrors();

    const username = document.getElementById("reg-username").value.trim();
    const password = document.getElementById("reg-password").value;
    const confirm  = document.getElementById("reg-confirm").value;

    let valid = true;
    if (!username)            { showError("err-reg-username", "Username is required");    valid = false; }
    if (username.length < 3)  { showError("err-reg-username", "At least 3 characters");   valid = false; }
    if (!password)            { showError("err-reg-password", "Password is required");    valid = false; }
    if (password.length < 6)  { showError("err-reg-password", "Minimum 6 characters");   valid = false; }
    if (password !== confirm) { showError("err-reg-confirm",  "Passwords do not match"); valid = false; }
    if (!valid) return;

    const btn = document.getElementById("register-btn");
    btn.disabled = true;
    btn.innerHTML = '<span class="spinner"></span> Creating account…';

    try {
      const data = await apiPost("/register", { username, password });

      if (data.success) {
        document.getElementById("register-alert").innerHTML =
          `<div class="alert alert-success">✅ Account created! You can now login.</div>`;
        setTimeout(() => switchTab("login"), 1500);
      } else {
        document.getElementById("register-alert").innerHTML =
          `<div class="alert alert-danger mt-2">❌ ${data.message}</div>`;
      }
    } catch {
      document.getElementById("register-alert").innerHTML =
        `<div class="alert alert-danger mt-2">❌ Server error.</div>`;
    } finally {
      btn.disabled = false;
      btn.textContent = "Create Account";
    }
  }
</script>
</body>
</html>
